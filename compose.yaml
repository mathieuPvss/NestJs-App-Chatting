services:
  postgres_app:
    image: postgres:17.4
    container_name: postgres_app
    volumes:
      - postgresApp:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  backend:
    image: node:23-alpine
    container_name: backend
    working_dir: /app
    volumes:
      - ./backend/app-chatting:/app
    ports:
      - 3000:3000
      - 9229:9229
    environment:
      - DB_HOST=${DB_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    entrypoint: ["sh", "./entrypoint.sh"]
    depends_on:
      - postgres_app

  adminer:
    image: adminer:latest
    ports:
      - 8081:8080
    depends_on:
      - postgres_app

volumes:
  postgresApp:
